name: Update streams
on:
  workflow_dispatch:

jobs:
  Update-streams:
    runs-on: ubuntu-latest
    steps:
    
      - name: checkout
        uses: actions/checkout@v3

      - name: update streams
        run: sh M3U/streams.sh

      - name: setup git config
        run: |
          git config user.name "M3UPT Bot"
          git config user.email "<>"

      - name: commit
        run: |
          git pull
          cd M3U
          git add M3UPT.m3u
          git commit -m "Update streams"
          git push origin main
